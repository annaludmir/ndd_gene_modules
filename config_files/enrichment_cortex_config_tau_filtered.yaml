run_name: "microcephaly_cortex_tau_filtered"
ndd_gene_modules_folder_root: "/miridan-data/annaludmir/ndd_gene_modules/"

output_folder: "results/enrichment_results/"

# GES results folder (step 1 output)
ges_results_folder: "results/ges_score_results/ges_score_for_cortex_20251221/"

# Tau scores folder — the data/ subfolder of a tau_pipeline.py run
# (must contain tau_scores_{column}.csv for each column below)
tau_scores_dir: "results/ges_score_results/tau_score_for_cortex_20260114/data"

# Percentile cutoff: genes with tau >= this percentile are kept (top 10% = 90)
tau_percentile: 90

gene_list_path: "data/genes/microcephaly_genes.csv"
gmt_folder: "data/genes/"

gsea:
  min_ges_score_threshold: 1

column_conditions_for_gsea:
  CellClass:
    - "Radial glia"
    - "Neuronal IPC"
    - "Neuron"
    - "Glioblast"
    - "Neuroblast"

  NPCs:
    - True
    - False

  Proliferation_CellCycle:
    - Proliferating_Cycling
    - Differentiating_Cycling
    - Proliferating_NonCycling
    - Differentiating_NonCycling

keep_only_significant: false
nes_keep_threshold: 1.5