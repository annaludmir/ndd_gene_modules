dataset_name: "all_layers"
ndd_gene_modules_folder_root: "/miridan-data/annaludmir/ndd_gene_modules/"

# GES results folder (output of specificity_score_calculations.py)
ges_results_folder: "results/ges_score_results/ges_score_for_all_layers_without_week_5_20260322"

# Where to write gene cluster results
output_folder: "results/gene_clusters/"

# ── Column/condition definitions ────────────────────────────────────────────
# Must match the columns used when the GES scores were computed.
column_conditions:
  Region:
    - "Forebrain"
    - "Telencephalon"
    - "Diencephalon"
    - "Midbrain"
    - "Hindbrain"
    - "Cerebellum"
    - "Pons"
    - "Medulla"

  CellClass:
    - "Radial glia"
    - "Neuronal IPC"
    - "Neuroblast"
    - "Neuron"
    - "Fibroblast"
    - "Glioblast"
    - "Oligo"
    - "Neural crest"
    - "Placode"
    - "Immune"
    - "Vascular"
    - "Erythrocyte"

  RegionsGeneral:
    - "Forebrain_General"
    - "Midbrain_General"
    - "Hindbrain_General"

# ── Gene filtering ──────────────────────────────────────────────────────────
# Keep genes that appear in at least this many GES files.
min_conditions_expressed: 2

# Optional: only keep genes with GES >= threshold in at least one condition.
# Set to null to include all genes regardless of score.
ges_score_threshold: null

# ── Scaling ─────────────────────────────────────────────────────────────────
# 'gene'      : z-score each gene across conditions (highlights expression pattern)
# 'condition' : z-score each condition across genes
# 'none'      : raw GES scores
scale: "gene"

# ── Dimensionality reduction & clustering ────────────────────────────────────
pca_n_components: 50
umap_n_neighbors: 15
umap_min_dist: 0.3
leiden_resolution: 0.5
