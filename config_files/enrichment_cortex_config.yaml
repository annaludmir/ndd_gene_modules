run_name: "ID_AFS_HM_cortex"
ndd_gene_modules_folder_root: "/miridan-data/annaludmir/ndd_gene_modules/"

output_folder: "results/enrichment_results/"
ges_results_folder: "results/ges_score_results/ges_score_for_cortex_20251204"
gene_list_path: "data/genes/sysndd_id_abnormal_facial_shape_abnormal_heart_morphology_for_pipeline.csv"
gmt_folder: "data/genes/"

analysis_mode: "gsea"     # or "deseq" or "both"

gsea:
  min_ges_score_threshold: 1

deseq:
  pseudobulk_folder: "data/.../psb/"
  gene_names: "data/.../genes_100cells.txt"

column_conditions_for_gsea:
  CellClass:
    - "Radial glia"
    - "Neuronal IPC"
    - "Neuron"
    - "Glioblast"
    - "Neuroblast"

  CellCyclePhase:
    - "G1"
    - "S"
    - "G2M"
    - "PostM"

  NPCs:
    - True

  Proliferating:
    - True

  Differentiating:
    - True

  Proliferating_NonCycling:
    - True

  Differentiating_NonCycling:
    - True