dataset_name: "gene_axes_scatter_v3"
ndd_gene_modules_folder_root: "/miridan-data/annaludmir/ndd_gene_modules/"
output_folder: "results/gene_axes_scatter/"

title: "Radial glia vs NPC  ×  S vs G2M"

# ── X-axis: Radial glia vs Neuronal IPC ──────────────────────────────────────
# Positive X → gene is more specifically expressed in Radial glia
# Negative X → gene is more specifically expressed in Neuronal IPC
x_axis:
  ges_results_folder: "results/ges_score_results/ges_score_for_cortex_20251221"
  column: "CellClass"
  numerator_conditions:
    - "Radial glia"
  denominator_conditions:
    - "Neuronal IPC"
  label: "GES score  (Radial glia − Neuronal IPC)"

# ── Y-axis: S vs G2M ─────────────────────────────────────────────────────────
# Positive Y → gene is more specifically expressed in S phase
# Negative Y → gene is more specifically expressed in G2M phase
y_axis:
  ges_results_folder: "results/ges_score_results/ges_score_for_cortex_cell_cycle_20251221"
  column: "CellCyclePhase"
  numerator_conditions:
    - "S"
  denominator_conditions:
    - "G2M"
  label: "GES score  (S − G2M)"

# ── Annotation ────────────────────────────────────────────────────────────────
# Number of genes to label per quadrant (ranked by distance from origin).
top_genes_per_quadrant: 10

# ── Optional colouring ───────────────────────────────────────────────────────
# Provide a gene_clusters.csv from the gene_clustering pipeline to colour dots
# by Leiden cluster:
# gene_clusters_csv: "results/gene_clusters/combined_v3_20260101/cortex/data/gene_clusters.csv"

# Provide a gene list CSV with 'gene','group' columns to colour by gene group
# (takes priority over gene_clusters_csv):
# gene_list_path: "gene_lists/my_genes.csv"
