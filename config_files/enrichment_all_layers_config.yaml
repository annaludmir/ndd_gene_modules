run_name: "Microcephaly All Data (Without Week 5)"
ndd_gene_modules_folder_root: "/miridan-data/annaludmir/ndd_gene_modules/"

output_folder: "results/enrichment_results/"
ges_results_folder: "results/ges_score_results/ges_score_for_all_layers_without_week_5_20260322"

gene_list_path: "data/genes/microcephaly_genes.csv"
gmt_folder: "data/genes/"

analysis_mode: "gsea"     # or "deseq" or "both"

gsea:
  min_ges_score_threshold: 0
  
deseq:
  pseudobulk_folder: "data/.../psb/"
  gene_names: "data/.../genes_100cells.txt"

column_conditions_for_gsea:
  Region:
    - "Forebrain"
    - "Telencephalon"
    - "Diencephalon"
    - "Midbrain"
    - "Hindbrain"
    - "Cerebellum"
    - "Pons"
    - "Medulla"

  CellClass:
    - "Radial glia"
    - "Neuronal IPC"
    - "Neuroblast"
    - "Neuron"
    - "Fibroblast"
    - "Glioblast"
    - "Oligo"
    - "Neural crest"
    - "Placode"
    - "Immune"
    - "Vascular"
    - "Erythrocyte"

  RegionsGeneral:
    - "Forebrain_General"
    - "Midbrain_General"
    - "Hindbrain_General"

  NeuronType:
    # scored in its own GES run
    ges_results_folder: "results/ges_score_results/ges_score_for_all_layers_neuron_type_20261026"
    conditions:
      - "Excitatory"
      - "Inhibitory"

  NeuronMaturity:
    # scored in its own GES run
    ges_results_folder: "results/ges_score_results/ges_score_for_all_layers_neuron_maturity_20261030"
    conditions:
      - "Immature"
      - "Intermediate"
      - "Mature"

  InhibitorySubtype:
    # scored in its own GES run; uncomment and set the run date once it has finished
    ges_results_folder: "results/ges_score_results/ges_score_for_all_layers_inhibitory_subtype_20261104"
    conditions:
      - "MGE"
      - "MGE_thalamic"
      - "LGE"
      - "CGE"
      - "Thalamic_local"
      - "Hypothalamic_SST"
  
  MidbrainLineage:
    # scored in its own GES run; uncomment and set the run date once it has finished
    ges_results_folder: "results/ges_score_results/ges_score_for_all_layers_midbrain_lineage_20261104"
    conditions:
      - "Dopaminergic_posteriorFP"
      - "Subthalamic_anteriorFP"
      - "RedNucleus_Motor_basal"

keep_only_significant: false
nes_keep_threshold: 1.5