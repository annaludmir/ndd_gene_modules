dataset_name: "deg_combined_v3"
ndd_gene_modules_folder_root: "/miridan-data/annaludmir/ndd_gene_modules/"
output_folder: "results/deg_analysis/"

# ── DEG thresholds (for defining condition-specific DEG sets) ────────────────
deg_logfc_threshold: 0.2    # log2 fold change > 0.2 (upregulated, as in doi:10.1038/s12276-024-01328-6)
deg_pval_threshold: 0.05    # BH-adjusted p-value < 0.05

# ── Datasets (v3 chemistry) ───────────────────────────────────────────────────
datasets:
  cortex:
    h5ad_path: "data/Cortex_EMX1_louvain3_passedQC_PostM_rev1.h5ad"
    chemistry: "v3"
    column_conditions:
      CellClass:
        - "Radial glia"
        - "Neuronal IPC"
        - "Neuroblast"
        - "Neuron"
        - "Glioblast"

  all_layers:
    h5ad_path: "data/human_dev_without_week_5.h5ad"
    chemistry: "v3"
    column_conditions:
      Region:
        - "Forebrain"
        - "Telencephalon"
        - "Diencephalon"
        - "Midbrain"
        - "Hindbrain"
        - "Cerebellum"
        - "Pons"
        - "Medulla"
      CellClass:
        - "Radial glia"
        - "Neuronal IPC"
        - "Neuroblast"
        - "Neuron"
        - "Fibroblast"
        - "Glioblast"
        - "Oligo"
        - "Neural crest"
        - "Placode"
        - "Immune"
        - "Vascular"
        - "Erythrocyte"
      RegionsGeneral:
        - "Forebrain_General"
        - "Midbrain_General"
        - "Hindbrain_General"

  cell_phase:
    h5ad_path: "data/Cortex_EMX1_louvain3_passedQC_PostM_rev1.h5ad"
    chemistry: "v3"
    column_conditions:
      CellCyclePhase:
        - "G1"
        - "S"
        - "G2M"
        - "PostM"
        - "Non-cycling"
